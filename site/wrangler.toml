# The site deploys as an assets-only Worker: there is no Worker script, just the
# static export. Wrangler uploads out/ and serves it, applying out/_headers.
name = "folio"
compatibility_date = "2026-09-16"
workers_dev = true
# The extension and this site report nothing; the tool that ships them shouldn't either.
send_metrics = false

[assets]
directory = "./out"
# Serve the exported 404 page for unknown paths rather than a bare Cloudflare error.
not_found_handling = "404-page"
